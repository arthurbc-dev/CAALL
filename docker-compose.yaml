version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: meu_banco
    restart: always
    environment:
      POSTGRES_DB: caall_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d caall_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./CAALL_BACK
      dockerfile: Dockerfile
    container_name: meu_backend
    restart: always 
    depends_on:
      - db
    networks:
      - db-net
      - back-net
    environment:
      JWT_SECRET: ${JWT_SECRET}
  frontend:
    build:
      context: ./CAALL_FRONT
      dockerfile: Dockerfile
    container_name: meu_frontend
    restart: always
    networks:
      - front-net
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: meu_cloudflared
    restart: always
    command: tunnel run
    environment:
     TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    networks:
      - back-net
      - front-net
    depends_on: 
        - backend
networks:
  db-net:
    driver: bridge
    internal: true
  back-net:
    driver: bridge
  front-net:
    driver: bridge

volumes:
  pgdata:
